      parameters:
      - description: Skill ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill object
        in: body
        name: skill
        required: true
        schema:
          $ref: '#/definitions/models.Skill'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
