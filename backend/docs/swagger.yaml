    get:
      consumes:
      - application/json
      description: Get a single skill by ID with parent data populated
      parameters:
      - description: Skill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SkillPopulated'
        "404":
