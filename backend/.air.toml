# Air configuration for MasteryPath backend hot-reload
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/main.exe cmd/api/main.go"
  bin = "tmp/main.exe"
  delay = 1000
  exclude_dir = ["tmp", "docs", "scripts", "vendor", "node_modules"]
  exclude_file = ["oldmaingo"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
